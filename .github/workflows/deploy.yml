name: Deploy Application

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          
      # 1. Install Composer khusus PROD
      - name: Install Composer Dependencies
        run: composer install --no-dev -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # 2. Compile asset CSS & JS (Vite)
      - name: Install NPM Dependencies & Build
        run: |
          npm ci
          npm run build

      # 3. Paketkan Aplikasi ke ZIP (tanpa menyertakan file sensitif, file upload & cache)
      - name: Create Deployment Zip
        run: |
          zip -r deploy.zip . -x "*.git*" "*node_modules*" "*.env*" "database/*.sqlite*" "tests/*" "storage/app/public/*" "storage/framework/*" "storage/logs/*"

      # 4. Kirim ZIP ke Server via SCP
      - name: Copy Zip to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "deploy.zip"
          target: ${{ secrets.SERVER_TARGET_PATH }}

      # 5. Ekstrak & Finalisasi di Server
      - name: Unzip and run post-deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ secrets.SERVER_TARGET_PATH }}
            unzip -q -o deploy.zip
            rm deploy.zip

            # Pastikan struktur folder storage dan permission siap
            mkdir -p storage/framework/{sessions,views,cache/data} storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Pastikan symlink storage terhubung
            php artisan storage:link

            # Sinkronkan aset Livewire agar interaksi UI & form tidak bermasalah
            php artisan vendor:publish --tag=livewire:assets --force

            # Bersihkan cache lama lalu buat cache baru agar perubahan langsung aktif
            php artisan optimize:clear
            php artisan optimize
            php artisan view:cache
            php artisan filament:optimize

            # Jalankan migrasi database jika ada
            php artisan migrate --force
